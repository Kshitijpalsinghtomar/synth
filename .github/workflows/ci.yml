name: Python tests

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
  workflow_dispatch:

# CI only reads source; do not grant the workflow a write-capable token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install numpy
          python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install build
      - name: Run unit and integration tests
        run: python -m pytest -p no:cacheprovider tests/ -q
      - name: Build and install wheel
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall --no-deps dist/*.whl
          synth --help
      - name: Compile the package
        run: python -m compileall -q esq_dsl training cli.py benchmarks tests
